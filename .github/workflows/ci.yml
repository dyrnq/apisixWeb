name: ci

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Java Environment
        run: env | grep '^JAVA'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Inspect builder
        run: |
          echo "Name:      ${{ steps.buildx.outputs.name }}"
          echo "Endpoint:  ${{ steps.buildx.outputs.endpoint }}"
          echo "Status:    ${{ steps.buildx.outputs.status }}"
          echo "Flags:     ${{ steps.buildx.outputs.flags }}"
          echo "Platforms: ${{ steps.buildx.outputs.platforms }}"

      - name: Maven build
        run: |
          ./mvnw -s ./settings.xml clean package -Dmaven.test.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true

      - name: Build dockerfile (without push)
        run: |
          chmod +x ./docker/rootfs/docker-entrypoint.sh
          chmod +x ./docker/rootfs/etc/s6-overlay/s6-rc.d/apisixweb/run
          ./buildx.sh --push false --repo ${{ secrets.DOCKER_USERNAME }} --image-name apisixweb --base eclipse-temurin:21-jre-noble
          ./buildx.sh --push false --repo ${{ secrets.DOCKER_USERNAME }} --image-name apisixweb --base eclipse-temurin:21-jdk-noble

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build dockerfile (with push)
        run: |
          ./buildx.sh --push true --repo ${{ secrets.DOCKER_USERNAME }} --image-name apisixweb --base eclipse-temurin:21-jre-noble
          ./buildx.sh --push true --repo ${{ secrets.DOCKER_USERNAME }} --image-name apisixweb --base eclipse-temurin:21-jdk-noble
