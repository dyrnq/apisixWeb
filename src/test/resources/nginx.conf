#user  nobody;
#worker_processes  1;
worker_processes  auto;
worker_cpu_affinity auto;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


stream {
	server {
		listen 13306;
		proxy_connect_timeout 1s;
		proxy_pass 127.0.0.1:3306;
	}
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

	#log_format collector '$remote_addr|$scheme|$host|$request_method|$server_protocol|$request_uri|$status|$request_time|$request_length|$bytes_sent';
	#access_log syslog:server=127.0.0.1:1514,tag=nginx,facility=local7,severity=info collector;

    open_log_file_cache max=1000 inactive=20s valid=1m min_uses=2;
	server_tokens off;
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout  1200; # 20*60 =1200s
	keepalive_requests 1000;
	reset_timedout_connection on;

	open_file_cache max=200000 inactive=20s;
	open_file_cache_valid 120s;
	open_file_cache_min_uses 2;
	open_file_cache_errors on;
	#client_max_body_size 200m;
	gzip on;
	gzip_min_length 10k;
	gzip_buffers 4 16k;
	#gzip_http_version 1.0;
	gzip_comp_level 4;
	gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript image/jpeg image/gif image/png;
	#gzip_types text/plain;
	gzip_vary on;
	gzip_disable "MSIE [1-6]\.";
	gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
	#gzip_proxied expired no-cache no-store private auth;

	http2_max_field_size 512k;
	http2_max_header_size 1024k;
	large_client_header_buffers 10 512k;
}
