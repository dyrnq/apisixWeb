<html>
<title>${projectName}</title>

<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<meta name="renderer" content="webkit" />
<meta name="force-rendering" content="webkit" />
<meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />

<link rel="shortcut icon" href="${ctx}/img/favicon.ico" type="image/x-icon">

<link href="${ctx}/lib/ztree/css/zTreeStyle/zTreeStyle.css" rel="stylesheet">
<link href="${ctx}/lib/layui/css/layui.css" rel="stylesheet" />
<link href="${ctx}/css/adminPage/base.css" rel="stylesheet" />

<body>

<div class="layui-bg-gray" style="padding: 30px;">
    <div class="layui-row layui-col-space15">
        <div class="layui-col-md6">
            <div class="layui-panel">
                <div style="padding: 50px 30px;">


                    <form class="layui-form" action="">
                        <div class="layui-form-item">
                            <label class="layui-form-label">${i18n.get("loginStr.name")}</label>
                            <div class="layui-input-block">
                                <input type="text" name="name" id="name" lay-verify="title" autocomplete="off" placeholder="请输入用户名" class="layui-input" autofocus />
                            </div>
                        </div>

                        <div class="layui-form-item">
                            <label class="layui-form-label">${i18n.get("loginStr.pass")}</label>
                            <div class="layui-input-block">
                                <input type="password" name="pass" id="pass" lay-verify="title" autocomplete="off" placeholder="请输入密码" class="layui-input" onkeyup="getKeyCode()" />
                            </div>
                        </div>

                        <div class="layui-form-item">
                            <div class="layui-input-block">
                                <button type="button" class="layui-btn" lay-submit="" lay-filter="demo1" onclick="login()">${i18n.get("loginStr.login")}</button>
                                <button type="button" class="layui-btn layui-btn-primary">重置</button>
                            </div>
                        </div>
                    </form>



                </div>
            </div>
        </div>
<!--        <div class="layui-col-md6">-->
<!--            <div class="layui-panel">-->
<!--                <div style="padding: 50px 30px;">一个面板</div>-->
<!--            </div>-->
<!--        </div>-->
    </div>
</div>


</body>
<#include "admin/script.html"/>
<script>
function login() {
	//$("#authCode").val($("#codeInput").val());

	var name = $("#name").val();
	var pass = $("#pass").val();
	//var code = Base64.encode(Base64.encode($("#code").val()));
	//var authCode = Base64.encode(Base64.encode($("#authCode").val()));

	$.ajax({
		type: 'POST',
		url: ctx + '/token/getToken',
		data: {
			name : name,
			pass : pass
		},
		dataType: 'json',
		success: function(data) {
		    //alert(JSON.stringify(data));
		    console.log(JSON.stringify(data));
			if (data.code == 200) {
			//	if($("#remember").prop("checked")){
			//		window.localStorage.setItem("time", new Date().getTime());
			//		window.localStorage.setItem("adminId",data.obj.id);
			//	} else {
			//		window.localStorage.removeItem("adminId");
			//	}

              var cname="TOKEN"
              var cvalue=data.data
              //console.log(cvalue)
              var exdays=1
//function setCookie(cname, cvalue, exdays) {
              const d = new Date();
              d.setTime(d.getTime() + (exdays*24*60*60*1000));
              let expires = "expires="+ d.toUTCString();
              document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
//}


				location.href = ctx + "/admin?";
			} else {
			    //alert("登陆失败");
				layer.msg("登陆失败");
				//refreshCode('codeImg');
			}



		},
		error: function() {
			layer.alert(commonStr.errorInfo);
		}
	});

}

function getKeyCode() {
	if (event.keyCode == 13) {
		login();
	}
}

</script>
</html>
