<!DOCTYPE HTML>
<html>
<head>
    <#include "admin/common.html"/>
    <style type="text/css">

.long{
	width: 210px;
}

.short{
	width: 110px!important;
}

input[name='param']{
	width: 100px;
}
</style>
</head>
<body class="layui-layout-body">
<div class="layui-layout layui-layout-admin">

    <#include "admin/header.html"/>
    <#include "admin/menu.html"/>

    <div class="layui-body">



        <!-- 内容主体区域 -->
        <div style="padding: 15px">
            <fieldset class="layui-elem-field layui-field-title">
                <legend>${i18n.get("menu.plugin")}</legend>
            </fieldset>

            <form action="${ctx}/adminPage/http" id="searchForm" method="post">
                <div class="layui-form">
                    <div class="layui-inline" style="display: none">
                        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" onclick="add()">${i18n.get("httpStr.add")}</button>
                    </div>
                    <div class="layui-inline" style="display: none">
                        <button type="button" class="layui-btn layui-btn-sm" onclick="guide()">${i18n.get("httpStr.guide")}</button>
                    </div>
                    <div class="layui-inline" style="display: none">
                        <button type="button" class="layui-btn layui-btn-sm" onclick="selectTemplateAsHttp()">${i18n.get("upstreamStr.selectTemplateAsParam")}</button>
                    </div>
                    <div class="layui-inline" style="display: none">
                        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" onclick="preview(null,'http')">${i18n.get("commonStr.preview")}</button>
                    </div>
                </div>
            </form>

            <table class="layui-hide" id="demo" lay-filter="test"></table>


        </div>
    </div>
</div>

<div style="height: 0px; width: 0px; overflow: hidden;">
    <!-- 弹出框 -->
    <div class="layui-form" id="windowDiv" style="padding: 15px; display: none">
        <form id="addForm1">
            <input type="hidden" name="id" id="id">

<!--            <div class="layui-form-item">-->
<!--                <label class="layui-form-label">${i18n.get("commonStr.name")}</label>-->
<!--                <div class="layui-input-block">-->
<!--                    <input type="text" name="id" class="layui-input">-->
<!--                </div>-->
<!--            </div>-->

            <div class="layui-form-item">
                <label class="layui-form-label">${i18n.get("commonStr.value")}</label>
                <div class="layui-input-block">
                    <textarea  name="rawData" class="layui-textarea" ></textarea>
                </div>
            </div>

            <div class="layui-form-item center">
                <button type="button" class="layui-btn layui-btn-normal" onclick="addOver()">${i18n.get("commonStr.submit")}</button>
                <button type="button" class="layui-btn" onclick="layer.closeAll()">${i18n.get("commonStr.close")}</button>
            </div>
        </form>

    </div>

    <div class="layui-form" id="guideDiv" style="padding: 15px; display: none;">

    </div>

</div>

<#include 'admin/script.html'/>

</body>


<script>

function addOver() {
    layui.use(['layer', 'form'], function(){
        $.ajax({
            type : 'POST',
            url : '/api/add/pluginMetadata',
            data : $('#addForm1').serialize(),
            dataType : 'json',
            success : function(data) {
                if(data.code=='200'){
                    //location.reload();
                    layer.closeAll();
                    layer.msg("新增成功");
                } else {
                    layer.msg(data.description);
                }
            },
            error : function() {
                layer.alert("系统错误");
            }
        });
    });
}

function schema(d) {
　　var addLink = d.id;
   if ('' == addLink || null == addLink || undefined == addLink) {
        return '';
   }
   if (addLink.length > 0) {
        return '<a class="layui-table-link" lay-event="detail" href="javascript:void(0);">view</a>&nbsp;&nbsp;&nbsp; <a class="layui-table-link" lay-event="setting" href="javascript:void(0);">setting</a>&nbsp;&nbsp;&nbsp;' + '<a class="layui-table-link" href="https://apisix.apache.org/zh/docs/apisix/plugins/'+addLink+'/" target="_blank">${i18n.get("commonStr.help")}</a>';
   }
}
function consumer_schema(d) {
   var addLink = d.consumer_schema;
   if ('' == addLink || null == addLink || undefined == addLink) {
        return '';
   }
    return '<a class="layui-table-link" lay-event="detail_consumer_schema" href="javascript:void(0);">view</a>';
}

function metadata_schema(d) {
   var addLink = d.metadata_schema;
   if ('' == addLink || null == addLink || undefined == addLink) {
        return '';
   }
   var p = d.metadata_schema.properties;

   if ('' == p || null == p || undefined == p || JSON.stringify(p) === '{}') {
        return '';
   }
   return '<a class="layui-table-link" lay-event="detail_metadata_schema" href="javascript:void(0);">view</a>';
}



layui.use(function(){ //亦可加载特定模块：layui.use(['layer', 'laydate', function(){
  //得到各种内置组件
  var layer = layui.layer //弹层
  ,laypage = layui.laypage //分页
  ,table = layui.table //表格

  //向世界问个好
  //layer.msg('Hello World');


  //执行一个 table 实例
  table.render({
    elem: '#demo'
    ,height: 1620
    ,url: '/api/plugin' //数据接口
    ,title: '用户表'
    ,page: false //开启分页
    ,toolbar: false
    ,totalRow: false //开启合计行
    ,cols: [[ //表头
       {field: 'id', title: 'ID', width:200, sort: true, fixed: 'left', totalRowText: '合计：'}
      ,{field: 'name', title: 'name', width:200}
      ,{field: 'type', title: 'type', width: 90, sort: true, totalRow: true}
      ,{field: 'version', title: 'version', width: 150}
      ,{field: 'priority', title: 'priority', width: 200 ,sort: true}
      ,{field: 'consumer_schema', title: 'consumer_schema', width: 200,templet: consumer_schema}
      ,{field: 'metadata_schema', title: 'metadata_schema', width: 200,templet: metadata_schema}
      ,{field: 'schema', title: 'schema', width: 500 ,templet: schema}

    ]]
    ,response: {
        statusCode: 200
    }
    ,parseData: function(res){ //将原始数据解析成 table 组件所规定的数据
      return {
        "code": res.code, //解析接口状态
        "msg": res.description, //解析提示文本
        "count": res.total, //解析数据长度
        "data": res.data //解析数据列表
      };
    }
  });



//工具条事件
    table.on('tool(test)', function(obj){ //注：tool 是工具条事件名，test 是 table 原始容器的属性 lay-filter="对应的值"
        var data = obj.data; //获得当前行数据
        var layEvent = obj.event; //获得 lay-event 对应的值（也可以是表头的 event 参数对应的值）
        var tr = obj.tr; //获得当前行 tr 的 DOM 对象（如果有的话）

        var layer = layui.layer //弹层
        var laypage = layui.laypage //分页

        if (layEvent === 'detail'){ //查看
            //do something
            layer.alert(JSON.stringify(data.schema),{ area: ['600px']});
        } else if(layEvent === 'del'){ //删除

        } else if(layEvent === 'LAYTABLE_TIPS'){
            layer.alert('Hi，头部工具栏扩展的右侧图标。');
        } else if (layEvent === 'edit'){//编辑,暂无方法体

        } else if (layEvent === 'detail_consumer_schema'){
            layer.alert(JSON.stringify(data.consumer_schema));
        } else if (layEvent === 'detail_metadata_schema'){
            layer.alert(JSON.stringify(data.metadata_schema));
        } else if (layEvent === 'setting'){
            $('#addForm1 input[name="id"]').val("");
            $('#addForm1 textarea[name="rawData"]').val("");
            $.ajax({
                    url: '/api/raw/pluginMetadata/'+obj.data.id,
                    type:'post',
                    //contentType: 'application/json',
                    //data:JSON.stringify({id:obj.data.id}),
                    success:function (data,statusText) {
                        console.log(data);
                        //var element =
                        if(data.code=='200'){
                            $('#addForm1 input[name="id"]').val(obj.data.id);
                            $('#addForm1 textarea[name="rawData"]').val(data.data.rawData);
                            //layer.msg(data.description);
                            layer.open({
                                type: 1,
                                area: ['800px', '600px'],
                                title: '修改插件Metadata',
                                content : $('#windowDiv')
                            });
                        }else{
                             layer.msg(data.description);
                        }
                    },
                    'error':function () {
                        layer.msg('系统错误');
                    }
                });


        }
    });



  //监听Tab切换
  element.on('tab(demo)', function(data){
    layer.tips('切换了 '+ data.index +'：'+ this.innerHTML, this, {
      tips: 1
    });
  });
});

</script>

</html>
