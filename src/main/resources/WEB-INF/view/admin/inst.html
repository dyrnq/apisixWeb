<!DOCTYPE HTML>
<html>
<head>
<#include "admin/common.html"/>
<style type="text/css">

.long{
	width: 210px;
}

.short{
	width: 110px!important;
}

input[name='param']{
	width: 100px;
}
</style>
</head>
<body class="layui-layout-body">
<div class="layui-layout layui-layout-admin">

<#include "admin/header.html"/>
<#include "admin/menu.html"/>

    <div class="layui-body">


        <!-- 内容主体区域 -->
        <div style="padding: 15px">
            <fieldset class="layui-elem-field layui-field-title">
                <legend>${i18n.get("menu.inst")}</legend>
            </fieldset>

            <form action="${ctx}/admin/http" id="searchForm" method="post">
                <div class="layui-form">
                    <div class="layui-inline" style="display: none">
                        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="add">${i18n.get("add.inst")}</button>
                    </div>
                    <div class="layui-inline" style="display:none">
                        <button type="button" class="layui-btn layui-btn-sm" id="guide">${i18n.get("commonStr.edit")}</button>
                    </div>
                    <div class="layui-inline" style="display:none">
                        <button type="button" class="layui-btn layui-btn-sm">${i18n.get("commonStr.edit")}</button>
                    </div>
                    <div class="layui-inline" style="display:none">
                        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal">${i18n.get("commonStr.clear")}</button>
                    </div>
                </div>
            </form>

            <table class="layui-hide" id="demo" lay-filter="test"></table>


        </div>
    </div>
</div>


<div style="height: 500px; width: 300px; overflow: hidden;">
    <!-- 弹出框 -->
    <div class="layui-form" id="windowDiv" style="padding: 15px; display: none">
        <form id="addForm1">
            <input type="hidden" name="u">

            <div class="layui-form-item" id="div_id">
                <label class="layui-form-label">id</label>
                <div class="layui-input-block">
                    <input type="text" name="id" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">name</label>
                <div class="layui-input-block">
                    <input type="text" name="name" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">url</label>
                <div class="layui-input-block">
                    <input type="text" name="url" class="layui-input">
                </div>
            </div>


            <div class="layui-form-item">
                <label class="layui-form-label">apiKey</label>
                <div class="layui-input-block">
                    <input type="text" name="apiKey" class="layui-input">
                </div>
            </div>


            <div class="layui-form-item center">
                <button type="button" class="layui-btn layui-btn-normal" id="addOver">${i18n.get("commonStr.submit")}</button>
                <button type="button" class="layui-btn" onclick="layer.closeAll()">${i18n.get("commonStr.close")}</button>
            </div>
        </form>
    </div>

    <div class="layui-form" id="guideDiv" style="padding: 15px; display: none;">
        <form id="addForm3">

            <div class="layui-form-item" style="display:none">
                <label class="layui-form-label">id</label>
                <div class="layui-input-block">
                    <input type="text" name="id" class="layui-input">
                </div>
            </div>


            <div class="layui-form-item" style="margin-top:20px;margin-bottom:20px">
                <label class="layui-form-label">tar file</label>
                <!--                <div class="layui-input-block">-->
                <!--                    <button type="button" class="layui-btn layui-btn-normal" id="upload-cert">cert file</button>-->
                <!--                </div>-->
                <div class="layui-input-inline short">
                    <button type="button" class="layui-btn layui-btn-normal" id="upload-cert">file</button>
                </div>
                <div class="layui-form-mid layui-word-aux"><span class="layui-inline layui-upload-choose" id="layui-upload-choose-cert"></span></div>

            </div>


            <div class="layui-form-item center">
                <button type="button" class="layui-btn layui-btn-normal" id="ID-upload-demo-action">${i18n.get("commonStr.submit")}
                    <i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop" id="loading" style="display: none"></i>
                </button>
                <button type="button" class="layui-btn" onclick="layer.closeAll()">${i18n.get("commonStr.close")}</button>
            </div>

        </form>
    </div>

    <div class="layui-form" id="exportForm">
        <form class="layui-form">
            <input type="hidden" name="format">
            <input type="hidden" name="id">

            <input type="radio" name="AAA" value="json" title="默认" lay-filter="demo-radio-filter" checked>
            <div lay-radio>
                <span style="color: blue;">json</span>
            </div>
            <input type="radio" name="AAA" value="yaml" title="默认" lay-filter="demo-radio-filter">
            <div lay-radio>
                <span style="color: green;">yaml</span>
            </div>
            <div class="layui-form-item center">
                <button type="button" class="layui-btn layui-btn-normal" id="choose">${i18n.get("commonStr.submit")}
                </button>
                <button type="button" class="layui-btn" onclick="layer.closeAll()">${i18n.get("commonStr.close")}</button>
            </div>
        </form>
    </div>

</div>

<#include 'admin/script.html'/>
<script type="text/html" id="toolbarDemo">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="add"><i class="layui-icon  layui-icon-add-1"></i></button>
        <button class="layui-btn layui-btn-sm" lay-event="deleteSelected"><i class="layui-icon  layui-icon-delete"></i></button>
        <button class="layui-btn layui-btn-sm" lay-event="getCheckData" style="display: none">获取选中行数据</button>
        <button class="layui-btn layui-btn-sm" lay-event="statusAll1" style="display: none">${i18n.get("commonStr.batchEnable")}</button>
        <button class="layui-btn layui-btn-sm" lay-event="statusAll0" style="display: none">${i18n.get("commonStr.batchDisable")}</button>
    </div>
</script>
<script src="${ctx}/js/admin/inst/index.js?v=${jsrandom}" type="text/javascript"></script>
</body>
</html>
