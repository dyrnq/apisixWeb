<script>
var certFile = {}
layui.use(['upload','layer'],function () {
    var upload = layui.upload;
    var layer = layui.layer;

    upload.render({
        elem: '#upload-cert'
        ,auto: false
        ,accept: "file"
        ,multiple: false
        ,before: function(res){
            console.log(res);
        }
        ,size: 5210
        //,done: function(res, index, upload){
        //}
        ,choose: (obj) => {
            //certFile = obj.pushFile();
            obj.preview(function(index, file, result){
                certFile=file;
                console.log(index); // 得到文件索引
                //console.log(file); // 得到文件对象
                //console.log(result); // 得到文件base64编码，比如图片
                $("#layui-upload-choose-cert").html("<p>"+file.name+"</p>");
            });
        }
        ,error: function(index, upload){
            console.log(index);
        }
    });



})

function addOver2() {
    layui.use(['layer'], function(){
        var formData = new FormData();
        var layer = layui.layer;
        formData.append("file",certFile);
        formData.append("id",$('#addForm3 input[name="id"]').val());
        $.ajax({
            type:'POST',
            url: "/api/import",
            data: formData,
            processData: false,
            contentType: false,
            async: false,
            dataType: "json",
            success:function (data,statusText) {
                if(data.code=='200'){
                    layer.msg('ok');
                }else{
                    layer.msg(data.description);
                }
            },
            error:function () {
                layer.msg('系统错误');
            }
        });

    });
}



    function add() {
        layui.use(['layer', 'form'], function(){
            var layer = layui.layer;
            var form = layui.form;
            // clean data
            $('#addForm1 input[name="id"]').val("");
            $('#addForm1 input[name="name"]').val("");
            $('#addForm1 input[name="url"]').val("");
            $('#addForm1 input[name="apiKey"]').val("");

            layer.open({
                type: 1,
                area: ['800px', '600px'],
                title: '添加新用户',
                content : $('#windowDiv')
            });
        });
    }


    function addOver() {
        var layer = layui.layer //弹层
        var laypage = layui.laypage //分页
        var table = layui.table //表格

        $.ajax({
            type : 'POST',
            url : '/api/inst/add',
            data : $('#addForm1').serialize(),
            dataType : 'json',
            success : function(data) {
                if(data.code=='200'){
                    //location.reload();
                    layer.closeAll();
                    layer.msg("新增成功");
                    //location.reload();
                    table.reload('demo',{});
                } else {
                    layer.msg(data.description);
                }
            },
            error : function() {
                layer.alert("系统错误");
            }
        });
    }

    function updateOver() {
        var layer = layui.layer //弹层
        var laypage = layui.laypage //分页
        var table = layui.table //表格
        $.ajax({
            type : 'POST',
            url : '/api/inst/update',
            data : $('#addForm2').serialize(),
            dataType : 'json',
            success : function(data) {
                console.log(data);
                if(data.code=='200'){
                    //location.reload();
                    layer.closeAll();
                    layer.msg("修改成功");
                    //location.reload();
                    table.reload('demo',{});
                } else {
                    layer.msg(data.description);
                }
            },
            error : function() {
                layer.alert("系统错误");
            }
        });
    }


    function addLink(d) {
        var addLink = d.id;
        if ('' == addLink || null == addLink || undefined == addLink) {
            return '';
        }
        if (addLink.length > 0) {
            return '<button type="button" class="layui-btn   layui-btn-normal  layui-btn-xs " lay-event="edit">' + commonStr.edit + '</button> '+'&nbsp;<button class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">'+commonStr.del+'</button>'

        }
    }
