<script>

    function add() {
        layui.use(['layer', 'form'], function(){
            var layer = layui.layer;
            var form = layui.form;
            layer.open({
                type: 1,
                area: ['800px', '600px'],
                title: '添加http路径',
                content : $('#windowDiv')
            });
        });
    }

function addOver() {
	$.ajax({
		type : 'POST',
		url : '/api/add/inst',
		data : $('#addForm1').serialize(),
		dataType : 'json',
		success : function(data) {
			if(data.code=='200'){
				//location.reload();
				layer.msg("新增成功");
			} else {
				layer.msg(data.description);
			}
		},
		error : function() {
			layer.alert("系统错误");
		}
	});
}

function addLink(d) {

    var addLink = d.id;
    //判断是否存在合法link,空格和null和未定义都会返回''。
    if ('' == addLink || null == addLink || undefined == addLink) {
        return '';
    }
    //如果是合法的路径，那么就正常添加，并配备编辑和删除的按键。
    if (addLink.length > 0) {
        return '<a class="layui-btn   layui-btn-normal  layui-btn-xs " href="/admin/editor?cls=route&id='+d.id + '" lay-event="edit">' +'编辑' + '</a> '+'| <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>';
    }
}
