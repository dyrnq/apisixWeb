  app:
    name: apisixWeb
  view:
    mapping:
      html: FreemarkerRender
  logging:
    logger:
      "io.undertow":
        level: "WARN"
    appender:
      console:
        level: INFO
      file:
        level: INFO
        maxFileSize: "1 MB"
        maxHistory: "7"

