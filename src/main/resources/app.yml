server:
  port: 8080
  contextPath: /
  request:
    maxBodySize: 2048mb
    maxHeaderSize: 20mb
  session:
    timeout: 7200
    name: "TOKEN"
    prefix: "Bearer"
    allowExpire: true
    allowAutoIssue: true
    allowUseHeader: false
    state:
      jwt:
        secret: "E3F9N2kRDQf55pnJPnFoo5+ylKmZQ7AXmWeOVPKbEd8:"

solon:
